plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virkan.skyguardian'
    compileSdk 35

    defaultConfig {
        applicationId 'com.virkan.skyguardian'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '2.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// web/ is canonical. Sync makes incremental builds remove deleted assets too,
// and never downloads a second copy of Three.js from a CDN.
def webDir = file('../../web')
def androidAssetsDir = file('src/main/assets')

tasks.register('prepareGameAssets', Sync) {
    filteringCharset = 'UTF-8'
    inputs.file(new File(webDir, 'index.html'))
    inputs.file(new File(webDir, 'three.min.js'))
    from(webDir) {
        include 'index.html', 'three.min.js', 'assets/**'
        filesMatching('index.html') {
            filter { line ->
                line.replace('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js', 'three.min.js')
                    .replace('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js', 'three.min.js')
            }
        }
    }
    into androidAssetsDir
    doFirst {
        for (String name : ['index.html', 'three.min.js']) {
            def source = new File(webDir, name)
            if (!source.isFile() || source.length() == 0) {
                throw new GradleException("Missing canonical game asset: ${source}")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareGameAssets')
}
